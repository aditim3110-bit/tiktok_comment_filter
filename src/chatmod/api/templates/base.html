<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chat review{% endblock %}</title>
<style>
:root{--bg:#fafafa;--card:#fff;--fg:#1d1d1f;--muted:#6b6b70;--line:#e3e3e8;--accent:#3b5bdb;--accent-fg:#fff;
  --sev0:#e9ecef;--sev1:#fff3bf;--sev2:#ffd8a8;--sev3:#ffc9c9;--sev-fg:#1d1d1f}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1b1b1f;--fg:#ececf0;--muted:#9a9aa2;--line:#2c2c31;
  --accent:#748ffc;--accent-fg:#0b0b0d;--sev0:#2c2c31;--sev1:#5c4d00;--sev2:#6b3a00;--sev3:#6e1d1d;--sev-fg:#ececf0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:15px}header nav{display:flex;gap:12px}header .stats{margin-left:auto;color:var(--muted);font-size:13px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
main{max-width:1000px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--sev0);color:var(--sev-fg)}
.sev1{background:var(--sev1)}.sev2{background:var(--sev2)}.sev3{background:var(--sev3)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.msg{font-size:18px;white-space:pre-wrap;word-break:break-word}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px;color:var(--muted)}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<header>
  <b>Chat review</b>
  <nav><a href="/review">Queue</a><a href="/review?status=resolved">Resolved</a><a href="/playground">Playground</a><a href="/docs">API</a></nav>
  <span class="stats">{{ stats.pending }} pending · {{ stats.claimed }} claimed · {{ stats.resolved }} resolved</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
