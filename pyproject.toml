[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatmod"
version = "0.1.0"
description = "Tiered moderation pipeline for live-stream chat, with an evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = ["detoxify>=0.5.2", "torch>=2.2"]
llm = ["google-genai>=1.0"]
data = ["datasets>=2.18"]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]
all = ["chatmod[ml,llm,data,dev]"]

[project.scripts]
chatmod = "chatmod.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatmod = ["api/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
